server.port=8080
spring.application.name=world-of-zuul-server
spring.jackson.default-property-inclusion=non_null

# 加载本地邮箱配置（复制 application-local.properties.example 为 application-local.properties 并填写）
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# 上传头像大小限制
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# 邮件服务：请在 application-local.properties 中填写真实 SMTP（见 application-local.properties.example）
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
zuul.mail.from=

# 禁止将验证码返回到 API / 前端（仅单元测试内存库可开启）
zuul.mail.dev-expose-code=false
