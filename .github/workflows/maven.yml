name: CI Pipeline

on:
  push:
    branches:
      - dev
      - "feature/**"
      - debug
      - "merge/**"
  pull_request:
    branches:
      - master
      - dev

env:
  JAVA_VERSION: "11"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check code style (Checkstyle)
        run: mvn checkstyle:check

      - name: Run unit tests
        run: mvn test

      - name: Build and package
        run: mvn package -DskipTests=false

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: game-jar
          path: target/*-jar-with-dependencies.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
